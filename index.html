<!DOCTYPE html>
<html lang="es" class="h-full bg-transparent">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Femicidios en Chile (2021 - 2025)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="p-2 sm:p-4 text-slate-800">

    <!-- Card Wrapper / Widget Container -->
    <div class="max-w-5xl mx-auto bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/90 flex flex-col justify-between min-h-[480px]">
        
        <!-- Header: Title & Subtitle -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 mb-2 border-b border-slate-100">
            <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 mb-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-600 animate-pulse"></span> Estadísticas Oficiales
                </div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight leading-snug">
                    Evolución de Femicidios en Chile (2021 – 2025)
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">
                    Comparativa de casos registrados por tipo de femicidio
                </p>
            </div>

            <!-- Interactive Hint -->
            <div class="hidden md:flex items-center gap-1.5 text-xs text-slate-400 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100 self-start sm:self-center">
                <i class="fa-solid fa-hand-pointer text-slate-400"></i>
                <span>Haz clic en la leyenda para filtrar series</span>
            </div>
        </header>

        <!-- Chart Container -->
        <div class="relative w-full h-[320px] sm:h-[380px] my-auto">
            <canvas id="femicidiosChart"></canvas>
        </div>

        <!-- Footer: Source Attribution -->
        <footer class="pt-4 mt-2 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-building-columns text-slate-400"></i>
                <span class="font-medium text-slate-700">Fuente:</span>
                <span>Servicio Nacional de la Mujer y la Equidad de Género (SernamEG)</span>
            </div>
            <div class="text-[11px] text-slate-400">
                Periodo 2021 - 2025
            </div>
        </footer>

    </div>

    <!-- Chart Configuration Script -->
    <script>
        // Registrar el plugin de DataLabels
        Chart.register(ChartDataLabels);

        // Datos oficiales del gráfico
        const years = ["2021", "2022", "2023", "2024", "2025"];
        const dataConsumado = [44, 43, 42, 44, 44];
        const dataFrustrado = [163, 180, 259, 319, 330];
        const dataTentado   = [24, 28, 47, 91, 70];

        window.onload = function() {
            const ctx = document.getElementById('femicidiosChart').getContext('2d');

            // Crear gradientes suaves para las áreas bajo la curva
            const gradConsumado = ctx.createLinearGradient(0, 0, 0, 320);
            gradConsumado.addColorStop(0, 'rgba(225, 29, 72, 0.12)');
            gradConsumado.addColorStop(1, 'rgba(225, 29, 72, 0.0)');

            const gradFrustrado = ctx.createLinearGradient(0, 0, 0, 320);
            gradFrustrado.addColorStop(0, 'rgba(217, 119, 6, 0.15)');
            gradFrustrado.addColorStop(1, 'rgba(217, 119, 6, 0.0)');

            const gradTentado = ctx.createLinearGradient(0, 0, 0, 320);
            gradTentado.addColorStop(0, 'rgba(79, 70, 229, 0.12)');
            gradTentado.addColorStop(1, 'rgba(79, 70, 229, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [
                        {
                            label: 'Femicidio Consumado',
                            data: dataConsumado,
                            borderColor: '#E11D48', // Rose / Red
                            backgroundColor: gradConsumado,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 6,
                            pointHoverRadius: 9,
                            pointBackgroundColor: '#E11D48',
                            pointBorderColor: '#FFFFFF',
                            pointBorderWidth: 2.5,
                            datalabels: {
                                align: 'top',
                                anchor: 'center',
                                offset: 8
                            }
                        },
                        {
                            label: 'Femicidio Frustrado',
                            data: dataFrustrado,
                            borderColor: '#D97706', // Amber / Orange
                            backgroundColor: gradFrustrado,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 6,
                            pointHoverRadius: 9,
                            pointBackgroundColor: '#D97706',
                            pointBorderColor: '#FFFFFF',
                            pointBorderWidth: 2.5,
                            datalabels: {
                                align: 'top',
                                anchor: 'center',
                                offset: 8
                            }
                        },
                        {
                            label: 'Femicidio Tentado',
                            data: dataTentado,
                            borderColor: '#4F46E5', // Indigo / Blue
                            backgroundColor: gradTentado,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 6,
                            pointHoverRadius: 9,
                            pointBackgroundColor: '#4F46E5',
                            pointBorderColor: '#FFFFFF',
                            pointBorderWidth: 2.5,
                            datalabels: {
                                align: 'top',
                                anchor: 'center',
                                offset: 8
                            }
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 25,
                            right: 20,
                            left: 10,
                            bottom: 5
                        }
                    },
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            align: 'center',
                            labels: {
                                usePointStyle: true,
                                pointStyle: 'circle',
                                boxWidth: 8,
                                boxHeight: 8,
                                padding: 20,
                                font: {
                                    family: 'Inter',
                                    size: 12,
                                    weight: '600'
                                },
                                color: '#334155'
                            }
                        },
                        tooltip: {
                            backgroundColor: '#0F172A',
                            titleFont: { family: 'Inter', size: 13, weight: '700' },
                            bodyFont: { family: 'Inter', size: 12, weight: '500' },
                            padding: 12,
                            cornerRadius: 10,
                            displayColors: true,
                            usePointStyle: true,
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.dataset.label}: ${context.raw} casos`;
                                }
                            }
                        },
                        // Configuración del Plugin DataLabels (cifras sobre los puntos)
                        datalabels: {
                            color: function(context) {
                                return context.dataset.borderColor;
                            },
                            font: {
                                family: 'Inter',
                                size: 11,
                                weight: '700'
                            },
                            formatter: function(value) {
                                return value;
                            },
                            listeners: {
                                // Evitar interferencias visuales si se ocultan datos
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    family: 'Inter',
                                    size: 13,
                                    weight: '600'
                                },
                                color: '#475569'
                            }
                        },
                        y: {
                            grid: {
                                color: '#F1F5F9',
                                strokeDasharray: [4, 4]
                            },
                            ticks: {
                                font: {
                                    family: 'Inter',
                                    size: 11
                                },
                                color: '#94A3B8',
                                stepSize: 50
                            },
                            beginAtZero: true,
                            suggestedMax: 360
                        }
                    }
                }
            });
        };
    </script>
</body>
</html>
